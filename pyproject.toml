[project]
name = "premium-laptop-watch"
version = "0.1.0"
description = "Monitor premium laptop deals at Best Buy and send Telegram alerts based on hardware quality and price."
readme = "README.md"
authors = [
    { name = "Musel25", email = "muselemmanuel@hotmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "playwright>=1.64.1",
]

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[project.scripts]
premium-laptop-watch = "premium_laptop_watch.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
